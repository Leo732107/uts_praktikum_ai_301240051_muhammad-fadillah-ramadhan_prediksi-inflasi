<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INFLASIGHT Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body{
            margin:0;
            background:#0f172a;
            color:white;
            font-family:Arial;
        }

        .navbar{
            background:#111827;
            padding:20px;
            display:flex;
            justify-content:space-between;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin-left:20px;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:40px;
        }

        .card{
            background:#1e293b;
            padding:30px;
            border-radius:20px;
            box-shadow:0 0 20px rgba(0,0,0,0.4);
        }

        h1{
            color:#38bdf8;
        }

        canvas{
            margin-top:30px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h2>INFLASIGHT</h2>

        <div>
            <a href="/">Dashboard</a>
            <a href="/analytics">Analytics</a>
            <a href="/prediction">Prediction</a>
            <a href="/about">About</a>
        </div>
    </div>

    <div class="container">

        <div class="card">

            <h1>Inflation Analytics</h1>

            <p>
                Grafik perkembangan tingkat inflasi Indonesia.
            </p>

            <canvas id="inflationChart"></canvas>

        </div>

    </div>

<script>

const ctx = document.getElementById('inflationChart');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: [
            '2000','2002','2004','2006',
            '2008','2010','2012','2014',
            '2016','2018','2020','2022','2024'
        ],

        datasets: [{
            label: 'Inflation Rate',

            data: [
                0.13,
                0.17,
                0.22,
                0.31,
                0.46,
                0.47,
                0.52,
                0.57,
                0.63,
                0.64,
                0.68,
                0.73,
                0.76
            ],

            borderWidth: 3,
            tension: 0.4
        }]
    },

    options: {
        responsive: true,

        plugins: {
            legend: {
                labels: {
                    color: 'white'
                }
            }
        },

        scales: {

            x: {
                ticks: {
                    color: 'white'
                }
            },

            y: {
                ticks: {
                    color: 'white'
                }
            }
        }
    }
});

</script>

</body>
</html>
